<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Translator</title>

  <!-- PWA / iOS home screen support -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Translator" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: linear-gradient(180deg, #0f172a, #1e293b);
      color: #f8fafc;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 2rem; margin-bottom: 0.25rem; }
    p { color: #94a3b8; margin-top: 0; }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 32px 24px;
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 420px;
    }
    button {
      font-size: 1.1rem;
      padding: 14px 28px;
      border-radius: 999px;
      border: none;
      background: #f43f5e;
      color: white;
      font-weight: 600;
      margin-top: 16px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }
    button.recording { background: #22c55e; transform: scale(1.03); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { min-height: 1.4em; color: #94a3b8; margin-top: 10px; font-size: 0.9rem; }
    #transcript {
      margin-top: 20px;
      text-align: left;
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
      padding: 16px;
      min-height: 60px;
      white-space: pre-wrap;
      font-size: 1rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>👋 Hello, world!</h1>
      <p>Translator app — installed as a home screen app.</p>

      <button id="recordBtn">🎙️ Start Recording</button>
      <div id="status"></div>
      <div id="transcript">Transcript will appear here…</div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }

    const WORKER_URL = 'https://translator-transcribe.lablegacy.workers.dev/transcribe';

    const recordBtn = document.getElementById('recordBtn');
    const statusEl = document.getElementById('status');
    const transcriptEl = document.getElementById('transcript');

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function pickMimeType() {
      const candidates = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
      for (const type of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
      }
      return '';
    }

    async function startRecording() {
      try {
        // iOS routes this to whatever mic is active system-wide — including
        // connected AirPods — automatically. No special pairing code needed.
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = pickMimeType();
        mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach((t) => t.stop());
          const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          await sendForTranscription(blob);
        };

        mediaRecorder.start();
        isRecording = true;
        recordBtn.textContent = '⏹️ Stop Recording';
        recordBtn.classList.add('recording');
        statusEl.textContent = 'Listening… (using system mic — AirPods if connected)';
      } catch (err) {
        statusEl.textContent = 'Mic access failed: ' + err.message;
      }
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.textContent = '🎙️ Start Recording';
        recordBtn.classList.remove('recording');
        statusEl.textContent = 'Transcribing…';
        recordBtn.disabled = true;
      }
    }

    async function sendForTranscription(blob) {
      try {
        const ext = blob.type.includes('mp4') ? 'mp4' : 'webm';
        const form = new FormData();
        form.append('file', blob, `audio.${ext}`);

        const resp = await fetch(WORKER_URL, { method: 'POST', body: form });
        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.error || `HTTP ${resp.status}`);
        }

        transcriptEl.textContent = data.text || '(no speech detected)';
        statusEl.textContent = 'Done.';
      } catch (err) {
        statusEl.textContent = 'Transcription failed: ' + err.message;
      } finally {
        recordBtn.disabled = false;
      }
    }

    recordBtn.addEventListener('click', () => {
      if (!isRecording) startRecording();
      else stopRecording();
    });
  </script>
</body>
</html>
