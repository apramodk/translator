<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Translator</title>

  <!-- PWA / iOS home screen support -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Translator" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: linear-gradient(180deg, #0f172a, #1e293b);
      color: #f8fafc;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    h1 { font-size: 2rem; margin-bottom: 0.25rem; }
    p { color: #94a3b8; margin-top: 0; }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 32px 24px;
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 420px;
    }
    button {
      font-size: 1.1rem;
      padding: 14px 28px;
      border-radius: 999px;
      border: none;
      background: #f43f5e;
      color: white;
      font-weight: 600;
      margin-top: 16px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }
    button.recording { background: #22c55e; transform: scale(1.03); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { min-height: 1.4em; color: #94a3b8; margin-top: 10px; font-size: 0.9rem; }

    canvas#waveform {
      width: 100%;
      height: 80px;
      margin-top: 16px;
      border-radius: 12px;
      background: rgba(0,0,0,0.25);
      display: block;
    }

    .section-label {
      text-align: left;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin: 16px 0 6px;
    }

    #liveTranscript, #finalTranscript {
      text-align: left;
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
      padding: 16px;
      min-height: 50px;
      white-space: pre-wrap;
      font-size: 1rem;
      line-height: 1.4;
    }

    .speaker-0 { color: #7dd3fc; }
    .speaker-1 { color: #fca5a5; }
    .speaker-2 { color: #bef264; }
    .speaker-3 { color: #fcd34d; }
    .speaker-label { font-weight: 700; display: block; margin-top: 8px; }
    .speaker-label:first-child { margin-top: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>🇭🇰 Cantonese → English</h1>
      <p>Live translation, powered on-device by your mic (+ AirPods).</p>

      <button id="recordBtn">🎙️ Start Recording</button>
      <div id="status"></div>

      <canvas id="waveform" width="600" height="160"></canvas>

      <div class="section-label">Live (updates every couple seconds)</div>
      <div id="liveTranscript">Translation will appear here…</div>

      <div class="section-label">Final — speaker-labeled</div>
      <div id="finalTranscript">Appears after you stop recording.</div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }

    const WORKER_BASE = 'https://translator-transcribe.lablegacy.workers.dev';
    const LIVE_CHUNK_MS = 1500; // shorter window = lower latency captions
    const SOURCE_LANGUAGE = 'yue'; // Cantonese

    const recordBtn = document.getElementById('recordBtn');
    const statusEl = document.getElementById('status');
    const liveEl = document.getElementById('liveTranscript');
    const finalEl = document.getElementById('finalTranscript');
    const canvas = document.getElementById('waveform');
    const canvasCtx = canvas.getContext('2d');

    let stream = null;
    let audioCtx = null;
    let analyser = null;
    let rafId = null;

    let fullRecorder = null;   // records the entire session, used for final diarized pass
    let fullChunks = [];
    let liveRecorder = null;   // short rolling recorder for near-live captions
    let liveTimer = null;
    let isRecording = false;

    function pickMimeType() {
      const candidates = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
      for (const type of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
      }
      return '';
    }

    // ---------- Waveform visualizer ----------
    function drawWaveform() {
      rafId = requestAnimationFrame(drawWaveform);
      const bufferLength = analyser.fftSize;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteTimeDomainData(dataArray);

      canvasCtx.fillStyle = 'rgba(0,0,0,0)';
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

      canvasCtx.lineWidth = 3;
      canvasCtx.strokeStyle = isRecording ? '#22c55e' : '#64748b';
      canvasCtx.beginPath();

      const sliceWidth = canvas.width / bufferLength;
      let x = 0;
      for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 128.0;
        const y = (v * canvas.height) / 2;
        if (i === 0) canvasCtx.moveTo(x, y);
        else canvasCtx.lineTo(x, y);
        x += sliceWidth;
      }
      canvasCtx.lineTo(canvas.width, canvas.height / 2);
      canvasCtx.stroke();
    }

    function setupVisualizer(mediaStream) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(mediaStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      drawWaveform();
    }

    function teardownVisualizer() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      if (audioCtx) {
        audioCtx.close().catch(() => {});
        audioCtx = null;
      }
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // ---------- Rolling near-live captions ----------
    function startLiveChunk() {
      if (!isRecording) return;
      const mimeType = pickMimeType();
      liveRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      const chunks = [];
      liveRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      liveRecorder.onstop = async () => {
        if (chunks.length) {
          const blob = new Blob(chunks, { type: liveRecorder.mimeType || 'audio/webm' });
          transcribeLiveChunk(blob);
        }
        if (isRecording) startLiveChunk(); // chain the next rolling window
      };
      liveRecorder.start();
      liveTimer = setTimeout(() => {
        if (liveRecorder && liveRecorder.state === 'recording') liveRecorder.stop();
      }, LIVE_CHUNK_MS);
    }

    let liveEntries = []; // { source, translated }

    async function transcribeLiveChunk(blob) {
      try {
        const ext = blob.type.includes('mp4') ? 'mp4' : 'webm';
        const form = new FormData();
        form.append('file', blob, `chunk.${ext}`);
        form.append('language', SOURCE_LANGUAGE);
        const resp = await fetch(`${WORKER_BASE}/translate-live`, { method: 'POST', body: form });
        const data = await resp.json();
        if (resp.ok && data.translated_text && data.translated_text.trim()) {
          liveEntries.push({ source: data.source_text, translated: data.translated_text });
          renderLiveTranscript();
        }
      } catch (_) {
        // Non-fatal — just skip this window's caption.
      }
    }

    function renderLiveTranscript() {
      liveEl.innerHTML = liveEntries
        .map(
          (e) =>
            `<div style="margin-bottom:10px"><div style="color:#94a3b8;font-size:0.85rem">${escapeHtml(e.source)}</div><div>${escapeHtml(e.translated)}</div></div>`
        )
        .join('');
      liveEl.scrollTop = liveEl.scrollHeight;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    // ---------- Recording lifecycle ----------
    async function startRecording() {
      try {
        // iOS routes this to whatever mic is active system-wide — including
        // connected AirPods — automatically. No special pairing code needed.
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        setupVisualizer(stream);

        const mimeType = pickMimeType();
        fullRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        fullChunks = [];
        fullRecorder.ondataavailable = (e) => { if (e.data.size > 0) fullChunks.push(e.data); };
        fullRecorder.start();

        liveEntries = [];
        liveEl.textContent = 'Listening…';
        finalEl.textContent = 'Appears after you stop recording.';

        isRecording = true;
        startLiveChunk();

        recordBtn.textContent = '⏹️ Stop Recording';
        recordBtn.classList.add('recording');
        statusEl.textContent = 'Listening… (using system mic — AirPods if connected)';
      } catch (err) {
        statusEl.textContent = 'Mic access failed: ' + err.message;
      }
    }

    function stopRecording() {
      if (!isRecording) return;
      isRecording = false;
      clearTimeout(liveTimer);
      if (liveRecorder && liveRecorder.state === 'recording') liveRecorder.stop();

      recordBtn.textContent = '🎙️ Start Recording';
      recordBtn.classList.remove('recording');
      statusEl.textContent = 'Finalizing…';
      recordBtn.disabled = true;

      fullRecorder.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        teardownVisualizer();
        const blob = new Blob(fullChunks, { type: fullRecorder.mimeType || 'audio/webm' });
        await transcribeFinalWithSpeakers(blob);
      };
      fullRecorder.stop();
    }

    async function transcribeFinalWithSpeakers(blob) {
      try {
        const ext = blob.type.includes('mp4') ? 'mp4' : 'webm';
        const form = new FormData();
        form.append('file', blob, `audio.${ext}`);
        form.append('language', SOURCE_LANGUAGE);

        const resp = await fetch(`${WORKER_BASE}/translate-final`, { method: 'POST', body: form });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);

        renderSpeakerTranscript(data);
        statusEl.textContent = 'Done.';
      } catch (err) {
        finalEl.textContent = 'Transcription failed: ' + err.message;
        statusEl.textContent = '';
      } finally {
        recordBtn.disabled = false;
      }
    }

    function renderSpeakerTranscript(data) {
      const segments = data.segments || [];
      if (!segments.length) {
        finalEl.textContent = data.text || '(no speech detected)';
        return;
      }
      finalEl.innerHTML = segments
        .map((seg, i) => {
          const idx = parseInt(seg.speaker.toString().replace(/\D/g, ''), 10) % 4 || (i % 4);
          return (
            `<span class="speaker-label speaker-${idx}">Speaker ${seg.speaker}</span>` +
            `<div style="color:#94a3b8;font-size:0.85rem">${escapeHtml(seg.text)}</div>` +
            `<div>${escapeHtml(seg.translated)}</div>`
          );
        })
        .join('');
    }

    recordBtn.addEventListener('click', () => {
      if (!isRecording) startRecording();
      else stopRecording();
    });
  </script>
</body>
</html>
